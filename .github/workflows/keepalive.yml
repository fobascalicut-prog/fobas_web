# Free automatic keep-alive: visits your site once a day so the free Supabase project does not pause.
# Already set to www.fobasgroup.com. Just push - GitHub runs it by itself.
name: keepalive
on:
  schedule:
    - cron: '17 3 * * *'   # every day at 03:17 UTC
  workflow_dispatch: {}      # also lets you run it by hand from the Actions tab
jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Visit the site (wakes the database)
        run: curl -L --fail --silent --show-error --retry 3 --max-time 30 "https://fobas.vercel.app/api/keepalive"
