# Free automatic keep-alive: visits your site once a day so the free Supabase project does not pause.
name: keepalive
on:
  schedule:
    - cron: '17 3 * * *'
  workflow_dispatch: {}
jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Visit the site (wakes the database)
        run: curl -L --fail --silent --show-error --retry 3 --max-time 30 "https://www.fobasgroup.com/api/keepalive"
